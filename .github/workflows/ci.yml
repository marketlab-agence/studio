# =============================================================================
# Katalyst — Intégration continue
# =============================================================================
# Référence : .kiro/specs/katalyst/requirements.md (REQ-FND-03)
#
# DURCISSEMENT PROGRESSIF (voir commentaires ci-dessous) :
# les étapes marquées « report-only » deviendront bloquantes au fil des tâches
# de la phase 0. Le CI reste vert pendant la mise en place du socle.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Le projet exige --legacy-peer-deps (conflits Storybook 8 / 10 déclarés).
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      # --- Bloquant : ESLint est configuré et à 0 erreur depuis T0.1 ---
      - name: Lint
        run: npm run lint

      # --- Bloquant : 0 erreur depuis T0.2 ---
      - name: Typecheck
        run: npm run typecheck

      # --- Bloquant : VERSION est la source unique de vérité ---
      - name: Cohérence de version
        run: npm run check:version

      # --- Bloquant : suite verte depuis la suppression des 2 suites obsolètes ---
      - name: Tests
        run: npm test

      # --- report-only : le script `build` est en syntaxe Windows cmd.
      #     On appelle next directement pour rester compatible Linux. ---
      - name: Build (report-only)
        continue-on-error: true
        run: npx next build

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: katalyst_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Installer le navigateur
        run: npx playwright install --with-deps chromium

      - name: Activer pgvector
        run: psql "postgresql://postgres:postgres@localhost:5432/katalyst_test" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Appliquer les migrations
        run: npm run db:migrate:test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/katalyst_test

      # Playwright démarre le serveur (webServer) ; l'application doit viser la
      # même base que celle qui vient d'être migrée.
      - name: Tests de bout en bout
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/katalyst_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/katalyst_test
          DATA_PROVIDER: postgres

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    name: Tests d'intégration DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: katalyst_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Activer pgvector
        run: psql "postgresql://postgres:postgres@localhost:5432/katalyst_test" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      # Les tests s'exécutent sur une base au schéma à jour.
      - name: Appliquer les migrations sur la base de test
        run: npm run db:migrate:test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/katalyst_test

      # Le test échoue si la base est injoignable (strict par défaut) :
      # un « vert » signifie que la base a réellement été testée.
      - name: Tests d'intégration
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/katalyst_test
